syntax = "proto3";

package alexandria.v1;

message Book {
    int32 id = 1;
    string title = 2;
    string author = 3;
    string isbn = 4;
    int32 total_copies = 5;
    int32 available_copies = 6;
    string school_code = 7;
    string category = 8;
    string keywords = 9;
    bool borrowable = 10;
}

message CreateBookRequest {
    string title = 1;
    string author = 2;
    string isbn = 3;
    int32 total_copies = 4;
    string school_code = 5;
    string category = 6;
    string keywords = 7;
    bool borrowable = 8;
}

message CreateBookResponse {
    Book book = 1;
}

message GetBookRequest {
    int32 id = 1;
}

message GetBookResponse {
    Book book = 1;
}

message ListBooksRequest {
    string search = 1;
}

message ListBooksResponse {
    repeated Book books = 1;
}

message UpdateBookRequest {
    Book book = 1;
}

message UpdateBookResponse {
    Book book = 1;
}

message DeleteBookRequest {
    int32 id = 1;
}

message DeleteBookResponse {
    bool success = 1;
}

service BookService {
    rpc CreateBook(CreateBookRequest) returns (CreateBookResponse);
    rpc GetBook(GetBookRequest) returns (GetBookResponse);
    rpc ListBooks(ListBooksRequest) returns (ListBooksResponse);
    rpc UpdateBook(UpdateBookRequest) returns (UpdateBookResponse);
    rpc DeleteBook(DeleteBookRequest) returns (DeleteBookResponse);
    rpc ExportBooks(ExportBooksRequest) returns (ExportBooksResponse);
    rpc ImportBooks(ImportBooksRequest) returns (ImportBooksResponse);
}

enum CsvImportMode {
    CSV_IMPORT_MODE_UNSPECIFIED = 0;
    CSV_IMPORT_MODE_APPEND = 1;
    CSV_IMPORT_MODE_REPLACE = 2;
}

message ExportBooksRequest {
}

message ExportBooksResponse {
    string csv_data = 1;
}

message ImportBooksRequest {
    string csv_data = 1;
    CsvImportMode mode = 2;
}

message ImportBooksResponse {
    bool success = 1;
    string error = 2;
    int32 imported_count = 3;
    int32 skipped_count = 4;
}